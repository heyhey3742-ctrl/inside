<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c96a43">
<link rel="icon" href="/img/icon.svg">
<link rel="stylesheet" href="/app.css">
<title>預約完成</title>
</head>
<body>
<header class="hero">
  <div class="brand" id="brand">Hour Jungle</div>
  <p>預約完成</p>
</header>
<div class="wrap">
  <div id="loading" class="card"><div class="spinner"></div></div>
  <div id="ok" class="hidden">
    <div class="card code-card hidden" id="confirmCard">
      <small id="confirmKicker">預約成功</small>
      <div style="font-size:26px;font-weight:800;margin:6px 0" id="confirmTitle"></div>
      <div class="valid" id="confirmTime"></div>
      <p style="margin:12px 0 0;font-size:14px;opacity:.9" id="confirmNote"></p>
    </div>
    <div class="card code-card" id="codeCard">
      <small>入場密碼</small>
      <div class="code" id="code"></div>
      <div class="valid" id="valid"></div>
      <p style="margin:12px 0 0;font-size:14px;opacity:.9" id="linkNote"></p>
    </div>
    <div class="card extend hidden" id="extendBox">
      <b id="extendTitle"></b>
      <p id="extendDesc"></p>
      <button class="btn block" id="extendBtn" type="button"></button>
    </div>
    <div class="card summary"><dl id="info"></dl><div class="total"><span>本筆金額</span><b id="amt"></b></div></div>
    <p class="hint center" id="mailNote"></p>
    <p class="hint center">請把這一頁加入書籤或截圖。之後也可以在首頁用「預約編號＋手機末三碼」查詢預約。</p>
    <a class="btn ghost block" href="/">回到首頁</a>
  </div>
  <div id="wait" class="hidden card center">
    <div class="spinner"></div>
    <p class="muted">正在跟銀行確認付款結果，請稍候…</p>
  </div>
  <div id="error" class="error hidden"></div>
</div>
<script src="/icons.js"></script>
<script src="/pay.js"></script>
<script src="/brand.js"></script>
<script src="/support.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const $ = (s) => document.querySelector(s);
let tries = 0;
function showErr(m) { const e = $('#error'); e.textContent = m; e.classList.remove('hidden'); }

async function load() {
  try {
    const res = await fetch('/api/order?id=' + encodeURIComponent(id || ''));
    const o = await res.json();
    if (!res.ok) throw new Error(o.error);
    $('#loading').classList.add('hidden');
    if (o.status === 'paid') return render(o);
    if (o.status === 'failed') return location.replace('/fail.html?id=' + o.id);
    $('#wait').classList.remove('hidden');
    if (++tries < 15) setTimeout(load, 2000);
    else { $('#wait').classList.add('hidden'); showErr('尚未收到付款結果。若已扣款，請稍後重新整理，或聯繫我們並提供預約編號 ' + o.id); }
  } catch (e) { $('#loading').classList.add('hidden'); showErr(e.message || '查無預約'); }
}

function render(o) {
  $('#wait').classList.add('hidden');
  $('#ok').classList.remove('hidden');
  try {
    const list = JSON.parse(localStorage.getItem('hj-bookings') || '[]').filter((x) => x !== o.id);
    localStorage.setItem('hj-bookings', JSON.stringify([o.id, ...list].slice(0, 10)));
  } catch {}
  const a = o.access;
  $('#codeCard').classList.toggle('hidden', !a);
  $('#confirmCard').classList.toggle('hidden', !!a);
  if (a) {
    $('#code').textContent = a.code;
    $('#valid').textContent = `${o.date}　${hh(a.start)} – ${hh(a.end)} 可入場`;
    $('#linkNote').textContent = a.bookings > 1 ? `已加訂（${a.periodLabel}），密碼不變` : '到現場在門口輸入密碼即可入場';
  } else {
    const consult = o.mode === 'consult';
    $('#confirmKicker').textContent = consult ? '諮詢預約成功' : (o.amount ? '付款成功・預約完成' : '預約成功');
    $('#confirmTitle').textContent = o.locationName;
    $('#confirmTime').textContent = `${o.date}　${o.slotLabel}`;
    $('#confirmNote').textContent = consult ? '專人會在預約前與你聯繫確認' : '當天請直接到館，報上姓名或預約編號即可';
  }

  const info = $('#info'); info.innerHTML = '';
  const rows = [['預約編號', o.id], ['地點', o.locationName], ['日期', o.date], ['時段', o.slotLabel]];
  if (o.topic) rows.push(['項目', o.topic]);
  if (o.mode !== 'consult') rows.push(['入場', hh(o.start)], ['出場', hh(o.end)], ['人數', o.people + ' 人']);
  for (const [k, v] of rows) {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    info.append(dt, dd);
  }
  $('#amt').textContent = o.amount ? money(o.amount) : '免費';
  $('#mailNote').textContent = !o.amount ? '' : o.invoiceNo
    ? `電子發票 ${o.invoiceNo} 已開立，通知信寄到 ${o.email}`
    : `電子發票開立後會寄到 ${o.email}`;

  // 加訂下一個時段（單獨計費，不套用多時段優惠）
  const n = o.next, box = $('#extendBox');
  if (n) {
    box.classList.remove('hidden');
    $('#extendTitle').textContent = `時間快到了？加訂${n.name}`;
    $('#extendDesc').textContent = n.available
      ? `${hh(n.start)} – ${hh(n.end)}，沿用同一組密碼。加訂為單獨計費，不適用多時段優惠。`
      : `${n.name}時段已經額滿，暫時無法加訂。`;
    const b = $('#extendBtn');
    b.textContent = n.available ? `加訂${n.name}・${money(n.amount)}` : '已額滿';
    b.disabled = !n.available;
    b.onclick = extend;
  }
  if (o.amount && !o.invoiceNo && tries++ < 20) setTimeout(async () => {
    const r = await fetch('/api/order?id=' + o.id).then((r) => r.json()).catch(() => ({}));
    if (r.invoiceNo) $('#mailNote').textContent = `電子發票 ${r.invoiceNo} 已開立，通知信寄到 ${r.email}`;
  }, 3000);
}

async function extend() {
  const b = $('#extendBtn');
  b.disabled = true; b.textContent = '處理中…';
  try {
    const res = await fetch('/api/extend', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);
    submitToECPay(d.form);
  } catch (e) {
    showErr(e.message || '加訂失敗');
    load();
  }
}
window.addEventListener('pageshow', (e) => { if (e.persisted) load(); });
load();
</script>
</body>
</html>
