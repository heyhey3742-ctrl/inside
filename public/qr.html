<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c96a43">
<link rel="icon" href="/img/icon.svg">
<link rel="stylesheet" href="/app.css">
<title>預約 QR Code</title>
<script src="/vendor/qrcode.js"></script>
<style>
  .qr { background: #fff; padding: 8px; line-height: 0; border-radius: 16px; display: inline-block; }
  .poster { text-align: center; }
  .poster h2 { margin-top: 18px; }
  @media print { .noprint { display: none; } body { background: #fff; color: #000; } .card { border: 0; } }
</style>
</head>
<body>
<div class="wrap poster">
  <div class="noprint card" style="text-align:left">
    <label for="target" style="margin-top:0">QR Code 要帶客人到哪裡？</label>
    <select id="target">
      <option value="">預約首頁（客人自己選地點）</option>
    </select>
  </div>
  <h2>掃描 QR Code 線上預約</h2>
  <p class="muted" id="sub">Hour Jungle 中山</p>
  <div class="qr"><div id="qrcode"></div></div>
  <p class="muted" id="url" style="word-break:break-all;font-size:13px"></p>
  <div class="noprint" style="display:flex;gap:10px;justify-content:center">
    <button class="btn" onclick="window.print()">列印</button>
    <a class="btn ghost" id="dl" download="hj-booking-qr.png">下載圖片</a>
  </div>
</div>
<script>
const sel = document.getElementById('target');
fetch('/api/config').then((r) => r.json()).then((c) => {
  for (const l of c.locations) sel.add(new Option(l.name + '（直接進入）', l.id));
});
function draw() {
  const url = location.origin + '/' + (sel.value ? '?loc=' + sel.value : '');
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  // 畫成高解析度圖片，方便列印或下載
  const n = qr.getModuleCount(), cell = 10, margin = 2;
  const c = document.createElement('canvas');
  c.width = c.height = (n + margin * 2) * cell;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
    if (qr.isDark(r, k)) g.fillRect((k + margin) * cell, (r + margin) * cell, cell, cell);
  }
  c.style.width = c.style.height = '260px';
  const box = document.getElementById('qrcode');
  box.innerHTML = '';
  box.appendChild(c);
  document.getElementById('url').textContent = url;
  document.getElementById('sub').textContent = 'Hour Jungle 中山' + (sel.value ? '・' + sel.options[sel.selectedIndex].text.replace('（直接進入）', '') : '');
  document.getElementById('dl').href = c.toDataURL('image/png');
}
sel.addEventListener('change', draw);
draw();
</script>
</body>
</html>
