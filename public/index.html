<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>線上預約</title>
<meta name="theme-color" content="#c96a43">
<link rel="icon" href="/img/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="hero">
  <a class="brand" id="brand" href="/">&nbsp;</a>
  <p id="tagline"></p>
</header>
<div class="wrap">
  <div class="steps" id="steps"><span></span><span></span><span></span><span></span></div>

  <!-- 1. 地點 -->
  <section id="step1">
    <div class="card venue" id="venue" style="margin-top:22px"></div>
    <h2>選擇地點</h2>
    <div class="chips" id="branchTabs" style="margin-bottom:12px"></div>
    <div id="locations"><div class="spinner"></div></div>
    <p class="center" style="margin-top:18px"><a href="/my.html" class="muted">已經預約過？查詢我的預約 →</a></p>
  </section>

  <!-- 2. 人數、日期、時段 -->
  <section id="step2" class="hidden">
    <div class="card place" id="placeTitle" style="margin-top:22px"></div>

    <!-- 時段制（咖啡廳）：Q&A 價目表 -->
    <div id="periodIntro" class="hidden">
      <div class="q"><span class="qi">Q</span><span>什麼是時段計費制？</span></div>
      <div class="card a">
        <div class="lead">
          <p>每個整點都能入場，依照你<em>跨到的時段</em>計費<br>分成 <em>早 / 中 / 晚</em>，跨越多個時段自動套用<em>多時段優惠</em>👇</p>
          <span class="ai">A</span>
        </div>
        <details class="prices" id="priceTable">
          <summary>方案價目表</summary>
          <div class="ptable" id="ptable"></div>
        </details>
      </div>
    </div>

    <!-- 時租制（HJ）：價目表 -->
    <div id="hourIntro" class="card hidden">
      <div class="ptable" id="htable" style="padding:0"></div>
    </div>

    <div id="peopleBox">
      <h2>人數</h2>
      <div class="card">
        <div class="stepper">
          <button type="button" id="peopleMinus" aria-label="減少">−</button>
          <output id="people">1</output>
          <button type="button" id="peoplePlus" aria-label="增加">＋</button>
        </div>
        <p class="hint" id="peopleHint" style="margin:10px 0 0"></p>
      </div>
    </div>

    <div id="topicBox" class="hidden">
      <h2>諮詢項目</h2>
      <div class="card"><div class="chips" id="topics"></div></div>
    </div>

    <h2 id="timeTitle">日期與時段</h2>
    <div class="card">
      <div class="dates" id="dates"></div>
      <div class="more-date">其他日期 <input type="date" id="datePicker"></div>
      <label id="slotHint">時段（可複選，需連續）</label>
      <div class="periods" id="periods"></div>
      <div class="slots hidden" id="slots"></div>
      <div class="legend hidden" id="legend"><span><i style="background:var(--brand)"></i>已選</span><span><i style="background:var(--full)"></i>額滿／已過</span><span id="afterLegend"><i style="background:var(--cream);border-style:dashed"></i>營業時間外</span></div>
      <div class="combo-note hidden" id="comboNote"></div>
      <div class="time-summary" id="timeSummary">
        <div><small>入場時間</small><b id="tIn">—</b></div>
        <div><small>出場時間</small><b id="tOut">—</b></div>
      </div>
    </div>
  </section>

  <!-- 3. 聯絡資料與發票 -->
  <section id="step3" class="hidden">
    <h2>聯絡資料</h2>
    <form class="card" id="form" autocomplete="on" onsubmit="return false">
      <div id="companyBox" class="hidden">
        <label for="company">公司名稱（選填）</label>
        <input id="company" autocomplete="organization">
      </div>
      <label for="name">姓名</label>
      <input id="name" name="name" autocomplete="name" required>
      <label for="phone">手機</label>
      <input id="phone" name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="0912345678" required>
      <label for="email">Email（預約確認與電子發票會寄到這裡）</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required>
      <label for="note">備註（選填）</label>
      <textarea id="note" maxlength="200" placeholder="例如：需要投影線、會晚 10 分鐘到"></textarea>
    </form>
    <div id="invoiceBox">
    <h2>發票</h2>
    <div class="card">
      <div class="seg" id="invType">
        <button type="button" data-v="personal" class="sel">會員載具</button>
        <button type="button" data-v="mobile">手機條碼</button>
        <button type="button" data-v="company">公司統編</button>
        <button type="button" data-v="donate">捐贈</button>
      </div>
      <div data-inv="personal"><p class="hint" style="margin:12px 0 0">發票存在綠界會員載具，開立後寄到你的 Email。</p></div>
      <div data-inv="mobile" class="hidden">
        <label for="carrier">手機條碼</label>
        <input id="carrier" placeholder="/ABC1234" autocapitalize="characters" maxlength="8">
      </div>
      <div data-inv="company" class="hidden">
        <label for="taxId">統一編號</label>
        <input id="taxId" inputmode="numeric" maxlength="8" placeholder="12345678">
        <label for="title">公司抬頭</label>
        <input id="title" autocomplete="organization">
        <label for="addr">地址（選填）</label>
        <input id="addr" autocomplete="street-address">
      </div>
      <div data-inv="donate" class="hidden">
        <label for="loveCode">捐贈碼</label>
        <input id="loveCode" inputmode="numeric" maxlength="7" placeholder="3–7 碼數字">
      </div>
    </div>
    </div>
  </section>

  <!-- 4. 確認 -->
  <section id="step4" class="hidden">
    <h2>確認預約</h2>
    <div class="card summary">
      <dl id="summary"></dl>
      <div class="lines" id="lines"></div>
      <div class="total"><span>應付金額</span><b id="total"></b></div>
    </div>
    <p class="hint" id="payHint">按下付款後會前往綠界 ECPay 安全刷卡頁面。付款完成前，時段會為你保留 <span id="holdMin">20</span> 分鐘。</p>
  </section>

  <div id="error" class="error hidden"></div>
  <footer id="footer"></footer>
</div>

<div class="bar">
  <div class="in">
    <button class="btn ghost hidden" id="back" type="button">上一步</button>
    <div class="price"><span id="priceLabel">選擇地點開始預約</span><b id="price">NT$ 0</b></div>
    <button class="btn" id="next" type="button" disabled>下一步</button>
  </div>
</div>

<script src="/icons.js"></script>
<script src="/pay.js"></script>
<script src="/support.js"></script>
<script src="/line.js"></script>
<script src="/app.js"></script>
</body>
</html>
